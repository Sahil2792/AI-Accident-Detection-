{% extends 'base.html' %}

{% block title %}Login | AI Accident Detection{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-lg-4 col-md-6">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary">Smart Road AI</h2>
                    <p class="text-muted">Secure access to accident monitoring system</p>
                </div>
                <form method="post" action="{{ url_for('main.login') }}">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button class="btn btn-primary w-100">Login</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{{ url_for('main.register') }}" class="text-decoration-none">Create a new account</a>
                </div>
                <div class="mt-3 text-center text-muted small">
                    Sign in with the account you created or use an existing profile.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
