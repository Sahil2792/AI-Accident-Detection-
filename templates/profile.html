{% extends 'base.html' %}

{% block title %}Profile | AI Accident Detection{% endblock %}

{% block content %}
<div class="row g-4">
    <div class="col-lg-6">
        <div class="card shadow-sm rounded-4">
            <div class="card-body">
                <h4 class="fw-bold mb-3">Edit Profile</h4>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input class="form-control" value="{{ user.full_name or user.username }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input class="form-control" value="{{ user.email }}">
                    </div>
                    <button class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card shadow-sm rounded-4">
            <div class="card-body">
                <h4 class="fw-bold mb-3">Change Password</h4>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Current Password</label>
                        <input type="password" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" class="form-control">
                    </div>
                    <button class="btn btn-outline-primary">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
