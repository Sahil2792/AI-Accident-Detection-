{% extends 'base.html' %}

{% block title %}Settings | AI Accident Detection{% endblock %}

{% block content %}
<div class="card shadow-sm rounded-4">
    <div class="card-body">
        <h4 id="settingsTitle" class="fw-bold mb-4" data-i18n="settings.title">Settings</h4>
        <div class="form-check form-switch mb-3">
                <input id="darkModeToggle" class="form-check-input" type="checkbox" checked>
                <label class="form-check-label" for="darkModeToggle" data-i18n="settings.dark_mode">Dark Mode</label>
        </div>
        <div class="form-check form-switch mb-3">
                <input id="notificationsToggle" class="form-check-input" type="checkbox" checked>
                <label class="form-check-label" for="notificationsToggle" data-i18n="settings.notifications">Notifications</label>
        </div>
        <div class="mb-3">
            <label class="form-label" data-i18n="settings.theme">Theme</label>
                <select id="themeSelect" class="form-select">
                    <option value="blue">Blue</option>
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label" data-i18n="settings.language">Language</label>
                <select id="languageSelect" class="form-select">
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="zh">Chinese</option>
                    <option value="ar">Arabic</option>
                    <option value="ja">Japanese</option>
                    <option value="ru">Russian</option>
                    <option value="pt">Portuguese</option>
                    <option value="it">Italian</option>
                    <option value="ko">Korean</option>
                </select>
            </div>

            <hr />
            <!-- Hidden wallpaper section: unlocked via secret double-click on page title -->
            <div id="wallpaperSection" style="display:none;">
                <h5 class="fw-semibold" data-i18n="settings.wallpaper">Custom Wallpaper / Watermark (Dark Mode)</h5>
                <div class="mb-3">
                    <label class="form-label" data-i18n="settings.upload_wallpaper">Upload Wallpaper / Watermark</label>
                    <input id="wallpaperInput" class="form-control" type="file" accept="image/*">
                    <div class="mt-2 d-flex gap-2">
                        <button id="uploadWallpaperBtn" class="btn btn-primary btn-sm" data-i18n="settings.upload">Upload</button>
                        <button id="removeWallpaperBtn" class="btn btn-outline-danger btn-sm" data-i18n="settings.remove_wallpaper">Remove Wallpaper</button>
                    </div>
                    <div class="mt-3">
                        <img id="wallpaperPreview" src="" alt="Wallpaper Preview" class="img-fluid rounded-3 d-none" style="max-height:160px; object-fit:contain;">
                    </div>
                    <!-- Discreet lock: hides this whole section again & clears session state -->
                    <div class="mt-3 d-flex justify-content-end">
                        <button id="lockSettingsBtn" type="button"
                                class="btn btn-sm btn-link text-muted text-decoration-none p-0"
                                title="Hide Advanced Settings">
                            <i class="bi bi-lock-fill me-1"></i>Lock Settings
                        </button>
                    </div>
                </div>
            </div>
            <!-- Advanced Settings link (discreet) -->
            <div class="mt-3">
                <a href="#" id="advancedSettingsLink" class="small text-muted">Advanced Settings</a>
            </div>

            <div class="mt-4 d-flex justify-content-end">
                <button id="saveSettingsBtn" class="btn btn-success">Save Settings</button>
            </div>
        </div>
</div>
{% endblock %}
