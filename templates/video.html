{% extends 'base.html' %}

{% block title %}Video Detection | AI Accident Detection{% endblock %}

{% block content %}
<div class="card shadow-sm rounded-4">
    <div class="card-body">
        <h4 class="fw-bold mb-3">Video Detection</h4>
        <form>
            <div class="mb-3">
                <label class="form-label">Upload Video</label>
                <input class="form-control" type="file" id="videoInput" accept="video/*">
            </div>
            <div class="mb-3">
                <video id="videoPreview" class="w-100 rounded-4 d-none" controls></video>
            </div>
            <div class="d-flex gap-2 mb-3">
                <button type="button" class="btn btn-primary" id="detectVideoBtn">Detect</button>
                <button type="button" class="btn btn-outline-primary" id="downloadResultBtn">Download Result</button>
            </div>
            <div class="progress" style="height: 10px;">
                <div class="progress-bar" id="videoProgressBar" role="progressbar" style="width: 0%"></div>
            </div>
        </form>

        <div class="mt-4">
            <h5>Detection Result</h5>
            <div class="card border-0 bg-light rounded-4 p-3">
                <p id="videoResultValue">Detection result placeholder</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
